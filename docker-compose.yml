services:
  medverify:
    build:
      context: .
      args:
        EMBEDDING_MODEL: ${EMBEDDING_MODEL:-sentence-transformers/all-MiniLM-L6-v2}
    ports:
      - "8000:8000"
    env_file:
      - .env
    volumes:
      - ./data:/app/data      # persists the audit database
    restart: unless-stopped